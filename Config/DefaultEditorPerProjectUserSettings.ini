[/Script/UnrealEd.EditorLoadingSavingSettings]
; This project imports every asset through the headless tools/ pipeline, never
; the editor's auto-import watcher.  The data JSONs we ship in Content
; (UI/Layouts/*.json, UI/Minimaps/minimaps.json) are read RAW at runtime
; (FFileHelper), not imported as assets — so the watcher's "import this new
; source file?" prompt is always wrong for them.  Turn it off.
bMonitorContentDirectories=False
