[/Script/UnrealEd.ProjectPackagingSettings]
; ROSE UI layouts/atlas are loose JSON under Content/UI (read via FFileHelper
; at runtime — see SRoseUIWindow::LoadLayout); stage them into packaged builds.
+DirectoriesToAlwaysStageAsUFS=(Path="UI")
; item_drops.json (faithful monster drops, read via FFileHelper in RoseDrops.cpp).
+DirectoriesToAlwaysStageAsUFS=(Path="DataTables")
; NPC conversations (CON→JSON + Lua chunks, read in RoseDialog.cpp).
+DirectoriesToAlwaysStageAsUFS=(Path="Dialogs")
; quests.json (QSD trigger database, read in RoseQuest.cpp).
+DirectoriesToAlwaysStageAsUFS=(Path="Quests")
; classic .cur hardware cursors (loaded as loose files by the OS cursor API).
+DirectoriesToAlwaysStageAsNonUFS=(Path="Slate/Cursors")
