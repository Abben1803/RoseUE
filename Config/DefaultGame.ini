[/Script/RoseUE.RoseBackend]
; Accounts / character roster / persistence service (backend/README.md).
; EMPTY = fully local: no accounts, no server-side saves, and the game behaves
; exactly as it does offline.  Set it, or pass -rosebackend=http://host:port.
; The zone server ALSO needs the ROSE_SERVICE_KEY environment variable; it is
; deliberately not read from config, because config files ship with the client.
BackendUrl=

